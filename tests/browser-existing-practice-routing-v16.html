<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>V1.6 Existing Practice Routing QA</title></head>
<body>
<pre id="result">V16_EXISTING_PRACTICE_PENDING</pre>
<iframe id="app" title="IELTS app" style="width:1280px;height:900px;border:0"></iframe>
<script type="module">
const out = document.querySelector('#result');
const frame = document.querySelector('#app');
const CORE = 'ielts-self-learning-v1';
const ADAPTIVE = 'ielts-adaptive-v1';
const GUIDE = 'ielts-site-guide-dismissed-v1';
const wait = async (fn, label, timeout = 12000) => {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    try { const value = fn(); if (value) return value; } catch {}
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  throw new Error(`Timed out waiting for ${label}`);
};
const textIncludes = (node, text) => Boolean(node?.textContent?.includes(text));
try {
  localStorage.clear();
  localStorage.setItem(GUIDE, 'true');
  const now = Date.now();
  localStorage.setItem(CORE, JSON.stringify({
    errors: [
      { id:'qa-reading-detail', ts:now, questionId:'MA01-R02', lessonId:'MA01', skill:'reading', errorTag:'detail', question:'Reading detail QA', myAnswer:'A', correctAnswer:'B', rationale:'QA' },
      { id:'qa-listening-detail', ts:now, questionId:'MA01-L04', lessonId:'MA01', skill:'listening', errorTag:'detail', question:'Listening detail QA', myAnswer:'A', correctAnswer:'B', rationale:'QA' },
      { id:'qa-listening-distractor', ts:now, questionId:'MA01-L05', lessonId:'MA01', skill:'listening', errorTag:'distractor', question:'Listening distractor QA', myAnswer:'A', correctAnswer:'B', rationale:'QA' },
      { id:'qa-reading-scope', ts:now, questionId:'MR02-Q7', lessonId:'MR02', skill:'reading', errorTag:'reading-scope', question:'Reading scope QA', myAnswer:'Street orientation', correctAnswer:'Average household income', rationale:'QA' },
      { id:'qa-information-function', ts:now, questionId:'MR01-Q9', lessonId:'MR01', skill:'reading', errorTag:'reading-information-function', question:'Information function QA', myAnswer:'Paragraph 2', correctAnswer:'Paragraph 4', rationale:'QA' },
      { id:'qa-contradiction', ts:now, questionId:'MR01-Q3', lessonId:'MR01', skill:'reading', errorTag:'reading-contradiction', question:'Contradiction QA', myAnswer:'TRUE', correctAnswer:'FALSE', rationale:'QA' },
      { id:'qa-not-given', ts:now, questionId:'MR01-Q2', lessonId:'MR01', skill:'reading', errorTag:'reading-not-given', question:'Not Given QA', myAnswer:'FALSE', correctAnswer:'NOT GIVEN', rationale:'QA' },
      { id:'qa-summary-logic', ts:now, questionId:'MR03-Q11', lessonId:'MR03', skill:'reading', errorTag:'reading-summary-logic', question:'Summary logic QA', myAnswer:'public path', correctAnswer:'storage capacity', rationale:'QA' },
      { id:'qa-evidence-tfng', ts:now, questionId:'MR01-Q1', lessonId:'MR01', skill:'reading', errorTag:'reading-evidence', question:'TFNG evidence QA', myAnswer:'FALSE', correctAnswer:'TRUE', rationale:'QA' },
      { id:'qa-evidence-mcq', ts:now, questionId:'MR03-Q5', lessonId:'MR03', skill:'reading', errorTag:'reading-evidence', question:'MCQ evidence QA', myAnswer:'B', correctAnswer:'A', rationale:'QA' },
      { id:'qa-evidence-unknown', ts:now, questionId:'UNKNOWN-EVIDENCE', lessonId:'MR99', skill:'reading', errorTag:'reading-evidence', question:'Unknown evidence control', myAnswer:'A', correctAnswer:'B', rationale:'QA' },
      { id:'qa-reading-inference', ts:now, questionId:'MA01-R05', lessonId:'MA01', skill:'reading', errorTag:'inference', question:'Reading inference Skill Repair control', myAnswer:'A', correctAnswer:'B', rationale:'QA' },
      { id:'qa-core-evidence', ts:now, questionId:'R04-Q3', lessonId:'R04', skill:'reading', errorTag:'reading-evidence', question:'Restoring urban wetlands can reduce the load on city drainage infrastructure after heavy rain.', myAnswer:'FALSE', correctAnswer:'TRUE', rationale:'QA' },
      { id:'qa-retriable-heading', ts:now, questionId:'R05-Q6', lessonId:'R05', skill:'reading', errorTag:'reading-detail-confusion', question:'Why is heading “Replacing books completely” a trap for Paragraph C?', myAnswer:'A', correctAnswer:'B', rationale:'QA' }
    ],
    fixedErrors: [], lessonAnswers: { 'R04-Q3': { selected:'FALSE', checked:true }, 'R05-Q6': { selected:'A', checked:true }, 'MR02-Q7': { selected:'A', checked:true } }, studyHistory: [], completedLessons: [],
    profile: { targetBand:7, placementSections:{ vocabulary:3, grammar:3, reading:3, listening:3 }, recommendedDifficulty:3 },
    study: { preferredMinutes:20 }, ui:{ chineseHelp:false }
  }));
  localStorage.setItem(ADAPTIVE, JSON.stringify({ repairProgress:{}, learningHistory:[], reviewSchedule:{} }));

  frame.src = '../index.html#/improve';
  await new Promise(resolve => frame.addEventListener('load', resolve, { once:true }));
  let doc = frame.contentDocument;
  let surface = await wait(() => doc.querySelector('[data-v16-existing-practice-improve]'), 'existing-practice Improve surface');
  if (!textIncludes(surface, 'These errors are already taught')) throw new Error('Improve surface heading missing');
  for (const marker of ['R02 → QR03', 'L05 → QL05', 'L04 → QL01', 'R04 → QR01', 'R02 → QR05', 'R02 → QR06']) {
    if (!textIncludes(surface, marker)) throw new Error(`Improve route missing: ${marker}`);
  }
  const familyMatch = family => surface.querySelector(`[data-existing-practice-family="${family}"]`);
  for (const family of ['reading-information-function','reading-contradiction','reading-not-given','reading-summary-logic','reading-evidence-tfng','reading-evidence-mcq']) {
    if (!textIncludes(familyMatch(family), '1 active match')) throw new Error(`${family}: expected one active routed match`);
  }
  if (!textIncludes(familyMatch('reading-evidence-tfng'), 'R04 → QR01')) throw new Error('TFNG evidence subtype did not retain R04 → QR01 on Improve');
  if (!textIncludes(familyMatch('reading-evidence-mcq'), 'R02 → QR03')) throw new Error('MCQ evidence subtype did not retain R02 → QR03 on Improve');
  const readingDetailFamily = familyMatch('reading-detail');
  if (!textIncludes(readingDetailFamily, '1 active match')) throw new Error('Retriable R05 lesson error was incorrectly counted in existing-practice aggregation');

  const skillSurface = await wait(() => doc.querySelector('[data-v16-skill-repair-improve]'), 'Skill Repair surface');
  const rr02 = [...skillSurface.querySelectorAll('.repair-card')].find(card => card.textContent.includes('RR02'));
  if (!textIncludes(rr02, '1 active match')) throw new Error('Reading inference was not retained by RR02 Skill Repair');

  let cardFor = id => doc.querySelector(`[data-error-id="${id}"]`)?.closest('.error-item');
  const expected = {
    'qa-reading-detail': ['Review R02', 'Practise QR03'],
    'qa-listening-detail': ['Review L05', 'Practise QL05'],
    'qa-listening-distractor': ['Review L04', 'Practise QL01'],
    'qa-reading-scope': ['Review R04', 'Practise QR01'],
    'qa-information-function': ['Review R02', 'Practise QR05'],
    'qa-contradiction': ['Review R04', 'Practise QR01'],
    'qa-not-given': ['Review R04', 'Practise QR01'],
    'qa-summary-logic': ['Review R02', 'Practise QR06'],
    'qa-evidence-tfng': ['Review R04', 'Practise QR01'],
    'qa-evidence-mcq': ['Review R02', 'Practise QR03']
  };
  for (const [id, labels] of Object.entries(expected)) {
    const card = await wait(() => cardFor(id), id);
    const route = card.querySelector('[data-v16-existing-practice-error-route]');
    if (!route) throw new Error(`${id}: existing-practice route missing`);
    for (const label of labels) if (!textIncludes(route, label)) throw new Error(`${id}: missing ${label}`);
  }
  if (cardFor('qa-evidence-unknown')?.querySelector('[data-v16-existing-practice-error-route]')) throw new Error('Unknown Reading evidence was guessed into a transfer route');
  if (cardFor('qa-reading-inference')?.querySelector('[data-v16-existing-practice-error-route]')) throw new Error('RR02 inference incorrectly duplicated as existing-practice route');

  for (const id of ['qa-core-evidence','qa-retriable-heading']) {
    const retriable = await wait(() => cardFor(id), `${id} retriable lesson error`);
    if (!retriable.querySelector('[data-action="retry-error"]')) throw new Error(`${id}: original lesson Retry action missing`);
    if (retriable.querySelector('[data-v16-existing-practice-error-route]')) throw new Error(`${id}: existing-practice route should not compete with original lesson Retry`);
  }

  const miniInitial = await wait(() => cardFor('qa-evidence-mcq'), 'Mini Test evidence error initial render');
  if (miniInitial.querySelector('[data-action="retry-error"]')) throw new Error('Mini Test evidence error exposed fake single-question Retry on initial render');

  // Revisit Improve after all production module side effects have completed. This
  // catches the historical timing bug where Mini Tests entered LESSONS after the
  // first render and became incorrectly retriable on a later render.
  frame.contentWindow.location.hash = '#/learn';
  await wait(() => frame.contentWindow.location.hash === '#/learn' && frame.contentDocument.querySelector('#main')?.textContent.includes('Learn by skill'), 'Learn rerender');
  frame.contentWindow.location.hash = '#/improve';
  await wait(() => frame.contentWindow.location.hash === '#/improve' && frame.contentDocument.querySelector('[data-v16-existing-practice-improve]'), 'Improve rerender');
  doc = frame.contentDocument;
  cardFor = id => doc.querySelector(`[data-error-id="${id}"]`)?.closest('.error-item');
  const miniAfterRerender = await wait(() => cardFor('qa-evidence-mcq'), 'Mini Test evidence error after rerender');
  if (miniAfterRerender.querySelector('[data-action="retry-error"]')) throw new Error('Mini Test evidence error became falsely retriable after production registry registration');
  const miniRoute = miniAfterRerender.querySelector('[data-v16-existing-practice-error-route]');
  if (!textIncludes(miniRoute, 'Review R02') || !textIncludes(miniRoute, 'Practise QR03')) throw new Error('Mini Test MCQ evidence lost question-type-aware routing after rerender');

  cardFor('qa-evidence-tfng').querySelector('[data-v16-existing-practice-error-route] [data-lesson="R04"]').click();
  await wait(() => frame.contentWindow.location.hash === '#/lesson/R04', 'R04 navigation');
  await wait(() => frame.contentDocument.querySelector('#main')?.textContent.includes('True, False or Not Given?'), 'R04 lesson render');

  frame.contentWindow.location.hash = '#/improve';
  await wait(() => frame.contentWindow.location.hash === '#/improve' && frame.contentDocument.querySelector('[data-v16-existing-practice-improve]'), 'Improve before QR03 transfer');
  doc = frame.contentDocument;
  cardFor = id => doc.querySelector(`[data-error-id="${id}"]`)?.closest('.error-item');
  cardFor('qa-evidence-mcq').querySelector('[data-v16-existing-practice-error-route] [data-lesson="QR03"]').click();
  await wait(() => frame.contentWindow.location.hash === '#/lesson/QR03', 'QR03 navigation');
  await wait(() => frame.contentDocument.querySelector('#main')?.textContent.includes('Question Type Lab: Reading Multiple Choice'), 'QR03 lesson render');

  frame.contentWindow.location.hash = '#/improve';
  await wait(() => frame.contentWindow.location.hash === '#/improve' && frame.contentDocument.querySelector('[data-v16-existing-practice-improve]'), 'Improve before QR05 transfer');
  doc = frame.contentDocument;
  cardFor = id => doc.querySelector(`[data-error-id="${id}"]`)?.closest('.error-item');
  cardFor('qa-information-function').querySelector('[data-v16-existing-practice-error-route] [data-lesson="QR05"]').click();
  await wait(() => frame.contentWindow.location.hash === '#/lesson/QR05', 'QR05 navigation');
  await wait(() => frame.contentDocument.querySelector('#main')?.textContent.includes('Question Type Lab: Matching Information'), 'QR05 lesson render');

  out.textContent = 'V16_EXISTING_PRACTICE_PASS';
} catch (error) {
  out.textContent = `V16_EXISTING_PRACTICE_FAIL: ${error.stack || error}`;
}
</script>
</body>
</html>
