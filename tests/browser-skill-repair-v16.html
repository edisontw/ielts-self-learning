<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>V1.6 Skill Repair Browser QA</title></head>
<body>
<pre id="result">V16_INTERACTION_PENDING</pre>
<iframe id="app" title="IELTS app" style="width:1280px;height:900px;border:0"></iframe>
<script type="module">
const out = document.querySelector('#result');
const frame = document.querySelector('#app');
const wait = async (fn, label, timeout = 12000) => {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    try { const value = fn(); if (value) return value; } catch {}
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  throw new Error(`Timed out waiting for ${label}`);
};
const clickValue = (doc, rid, q, value) => {
  const options = [...doc.querySelectorAll(`[data-lrv="repair-option"][data-rid="${rid}"][data-q="${q}"]`)];
  const button = options.find(item => item.dataset.value === value);
  if (!button) throw new Error(`${rid} Q${q + 1}: option not found: ${value}`);
  button.click();
};
const open = async route => {
  frame.src = `../index.html#/${route}`;
  await new Promise(resolve => frame.addEventListener('load', resolve, { once:true }));
  return wait(() => frame.contentDocument?.querySelector('[data-v15-repair-route]'), route);
};
const completeWithRetry = async lesson => {
  await open(`lesson/${lesson.id}`);
  const doc = frame.contentDocument;
  const wrong = lesson.questions[0].options.find(option => option !== lesson.questions[0].answer);
  clickValue(doc, lesson.id, 0, wrong);
  doc.querySelector(`[data-lrv="repair-check"][data-rid="${lesson.id}"][data-q="0"]`).click();
  await wait(() => doc.querySelector(`[data-lrv="repair-retry"][data-rid="${lesson.id}"][data-q="0"]`), `${lesson.id} Retry button`);
  if (!doc.querySelector(`[data-lrv="repair-complete"][data-rid="${lesson.id}"]`).disabled) throw new Error(`${lesson.id} Finish enabled after wrong answer`);
  doc.querySelector(`[data-lrv="repair-retry"][data-rid="${lesson.id}"][data-q="0"]`).click();
  await wait(() => !doc.querySelector(`[data-lrv="repair-option"][data-rid="${lesson.id}"][data-q="0"]`).disabled, `${lesson.id} retry reset`);

  for (let i = 0; i < lesson.questions.length; i++) {
    clickValue(doc, lesson.id, i, lesson.questions[i].answer);
    doc.querySelector(`[data-lrv="repair-check"][data-rid="${lesson.id}"][data-q="${i}"]`).click();
    await wait(() => doc.querySelectorAll('.feedback.correct').length >= i + 1, `${lesson.id} Q${i + 1} correct feedback`);
  }
  await wait(() => !doc.querySelector(`[data-lrv="repair-complete"][data-rid="${lesson.id}"]`).disabled, `${lesson.id} Finish enabled`);
  doc.querySelector(`[data-lrv="repair-complete"][data-rid="${lesson.id}"]`).click();
  await wait(() => doc.querySelector(`[data-lrv="repair-complete"][data-rid="${lesson.id}"]`)?.textContent.includes('Completed'), `${lesson.id} completion persistence`);
};
try {
  localStorage.clear();
  const { V16_SKILL_REPAIR_LESSONS } = await import('../skill-repair-registry-v16.js');
  const rr01 = V16_SKILL_REPAIR_LESSONS.find(item => item.id === 'RR01');
  const rr02 = V16_SKILL_REPAIR_LESSONS.find(item => item.id === 'RR02');
  const lr01 = V16_SKILL_REPAIR_LESSONS.find(item => item.id === 'LR01');
  if (!rr01 || !rr02 || !lr01) throw new Error('RR01/RR02/LR01 registry missing');

  await completeWithRetry(rr01);
  await completeWithRetry(rr02);

  await open('lesson/LR01');
  const doc = frame.contentDocument;
  const audio = [...doc.querySelectorAll('audio')];
  if (audio.length !== 2) throw new Error(`LR01 expected 2 audio elements, found ${audio.length}`);
  for (const item of audio) {
    const response = await fetch(item.src);
    if (!response.ok) throw new Error(`LR01 audio GET failed: ${response.status} ${item.src}`);
    const blob = await response.blob();
    if (blob.size <= 1000) throw new Error(`LR01 audio unexpectedly small: ${blob.size}`);
  }

  const adaptive = JSON.parse(localStorage.getItem('ielts-adaptive-v1') || '{}');
  if (!adaptive.repairProgress?.RR01?.completed) throw new Error('RR01 completion missing from shared adaptive state');
  if (!adaptive.repairProgress?.RR02?.completed) throw new Error('RR02 completion missing from shared adaptive state');
  out.textContent = 'V16_INTERACTION_PASS';
} catch (error) {
  out.textContent = `V16_INTERACTION_FAIL: ${error.stack || error}`;
}
</script>
</body>
</html>
