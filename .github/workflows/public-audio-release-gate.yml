name: Verify public ML03 ML04 audio

on:
  push:
    branches: [audio/ml03-ml04-production-live]
    paths:
      - .github/workflows/public-audio-release-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public site and exact deployed audio bytes
        shell: bash
        run: |
          set -euo pipefail
          base='https://edisontw.github.io/ielts-self-learning'

          curl --fail --location --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            "$base/" --output /tmp/index.html
          grep -q 'IELTS Learn — Self-Learning Workspace' /tmp/index.html

          curl --fail --location --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            "$base/media/audio/mini-tests/ml03-community-food-photography-workshop.mp3" \
            --output /tmp/ml03.mp3
          curl --fail --location --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            "$base/media/audio/mini-tests/ml04-river-monitoring-field-briefing.mp3" \
            --output /tmp/ml04.mp3

          test "$(stat -c%s /tmp/ml03.mp3)" = '3585505'
          test "$(stat -c%s /tmp/ml04.mp3)" = '3435667'
          echo 'c9705737b834d012e7b73a1242d3426cd496463afd96db5fc15ddb91a5577d20  /tmp/ml03.mp3' | sha256sum --check
          echo 'c24bb2b7542f65e349ee487eac853aa4bbcaccf680f566863b3299e23d251662  /tmp/ml04.mp3' | sha256sum --check

          echo 'Public GitHub Pages playback assets match the QA-approved production files.'
