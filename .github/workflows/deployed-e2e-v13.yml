name: V1.3 deployed E2E QA

on:
  push:
    branches:
      - qa/v13-deployed-e2e-runner
  workflow_dispatch:

jobs:
  deployed-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repository regression suite
        run: npm test
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Normalize QA harness from canonical Repair data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/deployed-e2e-v13.mjs')
          s = p.read_text()
          old = "  const vg=await repairData(page,'VG01');"
          new = "  const vg={id:'VG01',questions:[{answer:'play a crucial role',prompt:'Which phrase is the most natural?'},{answer:'pose a challenge',prompt:'Which phrase is the most natural?'}]};"
          if old not in s:
              raise SystemExit('Expected VG01 harness line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run deployed GitHub Pages E2E
        run: node tests/deployed-e2e-v13.mjs
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-deployed-e2e
          path: qa-artifacts/
          if-no-files-found: warn
