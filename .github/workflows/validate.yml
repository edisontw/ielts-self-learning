name: Validate prototype

on:
  push:
    branches: [main, refactor/v15-render-lifecycle]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: npm test
      - name: Browser smoke test
        run: bash tests/browser-smoke.sh
