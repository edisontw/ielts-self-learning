name: Validate prototype

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: npm test
      - name: Browser smoke test
        run: bash tests/browser-smoke.sh
      - name: V1.7 MA02 browser interaction
        run: bash tests/browser-ma02-v17-local.sh
      - name: Production E2E — deployed GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://edisontw.github.io/ielts-self-learning
        run: bash tests/production-e2e-v17.sh
