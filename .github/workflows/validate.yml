name: Validate prototype

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: npm test
      - name: Browser smoke test
        run: bash tests/browser-smoke.sh
      - name: V1.8 Today primary-action browser matrix
        run: bash tests/browser-today-primary-v18.sh
      - name: V1.8 Productive feedback-to-retry browser flow
        run: bash tests/browser-productive-retry-v18.sh
      - name: V1.8 Mobile/accessibility static guardrails
        run: node --check site-guide-focus-v18.js && node tests/validate-mobile-a11y-v18.mjs
      - name: V1.8 Mobile/accessibility browser matrix
        run: bash tests/browser-mobile-a11y-v18.sh
      - name: V1.8 Performance static baseline
        run: node tests/audit-performance-v18.mjs
      - name: V1.8 Performance browser baseline
        run: bash tests/browser-performance-v18.sh
      - name: V1.9 Diagnostic Evidence static guardrails
        run: node --check diagnostic-center-v19.js && node tests/validate-diagnostic-center-v19.mjs
      - name: V1.9 Diagnostic Evidence browser flow
        run: bash tests/browser-diagnostic-v19.sh
      - name: V1.10 Task 2 static guardrails
        run: node --check writing-task2-bank-v110.js && node tests/validate-writing-task2-v110.mjs
      - name: V1.10 Task 2 browser flow
        run: bash tests/browser-writing-task2-v110.sh
      - name: V1.11 Speaking sampler static guardrails
        run: node --check speaking-sampler-v111.js && node tests/validate-speaking-sampler-v111.mjs
      - name: V1.11 Speaking sampler browser flow
        run: bash tests/browser-speaking-sampler-v111.sh
      - name: V1.7 MA02 browser interaction
        run: bash tests/browser-ma02-v17-local.sh
      - name: Production E2E — deployed GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://edisontw.github.io/ielts-self-learning
        run: bash tests/production-e2e-v17.sh
      - name: V1.9 Production Diagnostic — deployed GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://edisontw.github.io/ielts-self-learning
        run: bash tests/production-diagnostic-v19.sh
      - name: V1.10 Production Task 2 — deployed GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://edisontw.github.io/ielts-self-learning
        run: bash tests/production-writing-task2-v110.sh
      - name: V1.11 Production Speaking sampler — deployed GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://edisontw.github.io/ielts-self-learning
        run: bash tests/production-speaking-sampler-v111.sh
