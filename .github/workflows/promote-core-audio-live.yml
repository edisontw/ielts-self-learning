name: Promote core audio live

on:
  push:
    branches: [media/promote-core-placement-live]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/promote-core-placement-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Promote verified audio and refresh docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          manifest_path = root / 'media/audio/manifest-v1.json'
          manifest = json.loads(manifest_path.read_text())
          promoted = {'PLACEMENT', 'L01', 'L02', 'L03', 'L04', 'L05'}
          for asset in manifest['assets']:
              if asset['id'] in promoted:
                  asset['status'] = 'production-live'
                  asset['qa']['technicalPlayback'] = 'passed — GitHub Pages deployment artifact and deploy job verified on 2026-08-26; exact file size and SHA-256 matched the QA-approved asset'
          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n')

          media_readme = root / 'media/audio/README.md'
          text = media_readme.read_text()
          text = text.replace('## Production-ready Placement and Core Lesson audio', '## Production-live Placement and Core Lesson audio')
          text = text.replace(
              'They remain `production-ready` until the merged GitHub Pages deployment is downloaded and verified byte-for-byte. The labelled browser-voice fallback remains available only if production playback fails.',
              'All six were verified against the GitHub Pages deployment on 2026-08-26 using exact file-size and SHA-256 checks. They are now `production-live`. The labelled browser-voice fallback remains available only if production playback fails.'
          )
          media_readme.write_text(text)

          readme = root / 'README.md'
          text = readme.read_text()
          text = text.replace(
              '- Question Type Labs: all 12 QL01–QL06 Set B/C recordings\n- Full Mock Listening production media',
              '- Question Type Labs: all 12 QL01–QL06 Set B/C recordings\n- Quick Placement and Core Lessons: Placement + L01–L05\n- Full Mock Listening production media'
          )
          text = text.replace(
              'Core lesson / Placement recordings remain the next production-audio gap; browser speech is retained only as a labelled fallback where a production file does not yet exist.',
              'Quick Placement and L01–L05 production MP3 assets are live; browser speech is retained only as a labelled fallback if production playback fails.'
          )
          text = text.replace(
              '1. produce and QA Quick Placement plus L01–L05 production Listening audio;\n2. expand Vocabulary / Grammar Repair from real recurring Error Notebook tags rather than adding generic grammar lessons blindly;\n3. perform direct deployed desktop and mobile QA for Placement → Study Plan → lesson → Lab A/B/C → Mini Test → Repair → retry → Full Mock → backup / restore;\n4. reduce progressive DOM-patching technical debt by consolidating mature UI enhancements into the base renderer;\n5. evaluate account sync or PWA only after the content, media and learner-data model is stable.',
              '1. expand Vocabulary / Grammar Repair from real recurring Error Notebook tags rather than adding generic grammar lessons blindly;\n2. perform direct deployed desktop and mobile QA for Placement → Study Plan → lesson → Lab A/B/C → Mini Test → Repair → retry → Full Mock → backup / restore;\n3. reduce progressive DOM-patching technical debt by consolidating mature UI enhancements into the base renderer;\n4. evaluate account sync or PWA only after the content, media and learner-data model is stable.'
          )
          readme.write_text(text)
          PY
      - name: Validate
        run: npm test
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-core-audio-live.yml
          git add README.md media/audio/README.md media/audio/manifest-v1.json
          git commit -m "Media: promote Placement and L01-L05 audio to live"
          git push origin HEAD:media/promote-core-placement-live
